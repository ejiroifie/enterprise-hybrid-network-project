enable
configure terminal
hostname HQ-SW1

! Enable Layer 3 Routing
ip routing

! Prevent log messages from interrupting your typing
line con 0
 logging synchronous
exit

! Create VLANs
vlan 10
 name DATA_USERS
vlan 20
 name VOICE
vlan 99
 name NATIVE_MGMT
exit

! Configure LACP EtherChannel Trunk to HQ-SW2
interface range GigabitEthernet0/1 - 2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode active
 exit

interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 exit

! Configure Layer 3 SVIs (Gateways)
interface Vlan10
 ip address 10.10.10.1 255.255.255.0
 no shutdown

interface Vlan20
 ip address 10.10.20.1 255.255.255.0
 no shutdown

interface Vlan99
 ip address 10.10.99.1 255.255.255.0
 no shutdown

! Configure Routed Link to HQ-R1
interface GigabitEthernet0/0
 no switchport
 ip address 10.0.0.2 255.255.255.252
 no shutdown
 exit

end
write memory
