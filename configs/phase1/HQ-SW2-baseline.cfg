enable
configure terminal
hostname HQ-SW2

! Ensure Layer 2 Mode (Disables L3 Routing)
no ip routing

! Prevent log messages from interrupting your typing
line con 0
 logging synchronous
exit

! Create VLANs
vlan 10
 name DATA_USERS
vlan 20
 name VOICE
vlan 99
 name NATIVE_MGMT
exit

! Configure LACP EtherChannel Trunk to HQ-SW1
interface range GigabitEthernet0/1 - 2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 channel-group 1 mode passive
 exit

interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 exit

! Configure Access Port for PC1
interface GigabitEthernet0/0
 switchport mode access
 switchport access vlan 10
 no shutdown
 exit

! Configure Management SVI & Default Gateway
interface Vlan99
 ip address 10.10.99.2 255.255.255.0
 no shutdown
 exit

ip default-gateway 10.10.99.1

end
write memory
